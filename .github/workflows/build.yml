name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast checks: the unit tests, the proxy tests, and a debug APK you can install right away.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Proxy tests (assist + transcribe)
        working-directory: llm-proxy
        run: npm test

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Test report (if tests failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - uses: actions/upload-artifact@v4
        with:
          name: buildx-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # Checks that need a real Android (the alarm service, real views, the real pipeline), on an emulator.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (emulator, Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle connectedDebugAndroidTest --stacktrace

      - name: Instrumented report (if tests failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report
          path: app/build/reports/androidTests/

  # A signed release APK. Runs only when the signing secrets exist (see README, "Release signing").
  release:
    runs-on: ubuntu-latest
    needs: build
    env:
      KEYSTORE_B64: ${{ secrets.BUILDX_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        if: env.KEYSTORE_B64 != ''

      - uses: actions/setup-java@v4
        if: env.KEYSTORE_B64 != ''
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: env.KEYSTORE_B64 != ''
        with:
          gradle-version: 8.9

      - name: Build signed release APK
        if: env.KEYSTORE_B64 != ''
        env:
          BUILDX_KEYSTORE_PASSWORD: ${{ secrets.BUILDX_KEYSTORE_PASSWORD }}
          BUILDX_KEY_ALIAS: ${{ secrets.BUILDX_KEY_ALIAS }}
          BUILDX_KEY_PASSWORD: ${{ secrets.BUILDX_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export BUILDX_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          gradle assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Check the APK is signed
        if: env.KEYSTORE_B64 != ''
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "$APK"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 != ''
        with:
          name: buildx-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Skipped
        if: env.KEYSTORE_B64 == ''
        run: echo "No signing secrets set, release build skipped (see README)."
